<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Instrumento de Autoevaluación Institucional</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy-900:#0E1C36;
    --navy-700:#173A66;
    --navy-500:#2C548C;
    --ice-100:#EEF4FA;
    --ice-200:#DCE9F5;
    --ice-300:#B9D2E8;
    --gold:#B8912B;
    --gold-soft:#E9D9A8;
    --ok:#2E7D4F;
    --warn:#B8860B;
    --bad:#B23A3A;
    --ink:#16202E;
    --paper:#FBFAF7;
    --display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --body:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow-x:hidden;}
  .app{display:flex;min-height:640px;max-width:1180px;margin:0 auto;border:1px solid var(--ice-300);background:#fff;box-shadow:0 1px 3px rgba(14,28,54,.08);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy-900),var(--navy-700));color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:22px;}
  .brand{font-family:var(--display);font-size:15px;letter-spacing:.03em;line-height:1.35;color:var(--ice-100);border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:16px;}
  .brand small{display:block;margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gold-soft);text-transform:uppercase;}

  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 14px;border-bottom:1px solid rgba(255,255,255,.18);}
  .gauge svg{display:block;}
  .gauge-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice-300);text-align:center;}
  .gauge-pct{font-family:var(--display);font-size:26px;color:#fff;}

  nav.steps{display:flex;flex-direction:column;gap:4px;flex:1;}
  .step{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:3px;cursor:pointer;border:1px solid transparent;color:var(--ice-200);font-size:13px;transition:background .15s;}
  .step:hover{background:rgba(255,255,255,.06);}
  .step.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;}
  .step .num{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;border:1px solid var(--ice-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step.done .num{background:var(--gold);border-color:var(--gold);color:var(--navy-900);font-weight:600;}
  .step.locked{opacity:.45;cursor:not-allowed;}
  .step.locked .num{font-size:10px;}

  .stepWarning{display:none;background:#FDECEA;color:#B23A3A;border-bottom:1px solid #F5C6C0;padding:10px 34px;font-size:12.5px;font-weight:600;}
  .step .meta{display:flex;flex-direction:column;}
  .step .meta b{font-weight:600;font-size:13px;}
  .step .meta span{font-size:10.5px;color:var(--ice-300);font-family:var(--mono);letter-spacing:.03em;}

  /* ---------- MAIN ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{padding:20px 34px;border-bottom:1px solid var(--ice-200);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbarLogo{height:64px;width:auto;object-fit:contain;flex-shrink:0;}
  .topbar h1{font-family:var(--display);font-size:21px;margin:0;color:var(--navy-900);}
  .topbar .sub{font-size:12.5px;color:#5a6b80;}
  .content{flex:1;overflow-y:auto;padding:28px 34px 40px;}
  .section-intro{font-size:13px;color:#4b5b6e;max-width:640px;margin:0 0 22px;line-height:1.55;}
  .privacyNotice{background:#FFF8E6;border:1px solid #E9D9A8;border-left:4px solid var(--gold);border-radius:2px;padding:14px 16px;margin:0 0 24px;font-size:12.5px;line-height:1.6;color:#5a4a1a;max-width:680px;}
  .privacyNotice strong{display:block;margin-bottom:4px;color:var(--navy-900);font-size:12.5px;}
  .consentCheck{display:flex;align-items:flex-start;gap:10px;max-width:680px;margin:0 0 24px;padding:12px 14px;background:#fff;border:1px solid var(--ice-300);border-radius:2px;cursor:pointer;font-size:12.5px;line-height:1.55;color:var(--ink);}
  .consentCheck input{margin-top:2px;flex-shrink:0;width:16px;height:16px;accent-color:var(--gold);cursor:pointer;}

  .field{margin-bottom:18px;max-width:560px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--navy-700);margin-bottom:6px;letter-spacing:.01em;}
  .field input[type=text],.field input[type=date],.field textarea{width:100%;border:1px solid var(--ice-300);background:var(--ice-100);padding:9px 11px;font-family:var(--body);font-size:13.5px;border-radius:2px;color:var(--ink);}
  .field input:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fff;}
  .field textarea{resize:vertical;min-height:56px;}

  .dim-title{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-500);background:var(--ice-100);border-left:3px solid var(--gold);padding:8px 12px;margin:26px 0 14px;}
  .dim-title:first-child{margin-top:0;}

  .qcard{border:1px solid var(--ice-200);border-radius:3px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  .qcard.answered{border-left:3px solid var(--ok);}
  .qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .qid{font-family:var(--mono);font-size:11px;color:#fff;background:var(--navy-700);border-radius:2px;padding:2px 7px;flex-shrink:0;margin-top:1px;}
  .qtext{font-size:13.5px;line-height:1.5;color:var(--ink);}
  .qart{font-family:var(--mono);font-size:10.5px;color:#8a97a8;margin-top:3px;}

  .pillrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .pill{border:1px solid var(--ice-300);background:#fff;padding:6px 14px;font-size:12.5px;border-radius:16px;cursor:pointer;color:#4b5b6e;user-select:none;}
  .pill[data-v="Sí"].sel{background:var(--ok);border-color:var(--ok);color:#fff;}
  .pill[data-v="Parcial"].sel{background:var(--warn);border-color:var(--warn);color:#fff;}
  .pill[data-v="No"].sel{background:var(--bad);border-color:var(--bad);color:#fff;}
  .pill[data-v="Alta"].sel{background:var(--bad);border-color:var(--bad);color:#fff;}
  .pill[data-v="Media"].sel{background:var(--warn);border-color:var(--warn);color:#fff;}
  .pill[data-v="Baja"].sel{background:var(--ok);border-color:var(--ok);color:#fff;}

  .levelrow{display:flex;gap:6px;margin-bottom:10px;}
  .lvl{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ice-300);background:#fff;font-family:var(--mono);font-size:13px;cursor:pointer;color:#4b5b6e;
       display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:transform .1s, border-color .15s, background .15s;flex-shrink:0;}
  .lvl:hover{border-color:var(--navy-500);transform:translateY(-1px);}
  .lvl.sel{background:var(--navy-700);border-color:var(--navy-700);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(23,58,102,.35);}
  .lvldesc{font-size:11.5px;color:#8a97a8;margin:-4px 0 10px;font-style:italic;}

  .qcard textarea{width:100%;border:1px solid var(--ice-200);background:var(--ice-100);padding:7px 9px;font-family:var(--body);font-size:12.5px;border-radius:2px;min-height:40px;resize:vertical;}
  .qcard textarea:focus{outline:1px solid var(--gold);background:#fff;}
  .qcard .miniLabel{font-size:10.5px;color:#8a97a8;margin:2px 0 4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;}
  .prioRow{margin-top:10px;}

  .footer{border-top:1px solid var(--ice-200);padding:16px 34px;display:flex;justify-content:space-between;align-items:center;}
  .navbtn{border:1px solid var(--ice-300);background:#fff;color:var(--navy-700);padding:9px 18px;font-size:12.5px;border-radius:2px;cursor:pointer;font-family:var(--body);}
  .navbtn:hover{background:var(--ice-100);}
  .navbtn:disabled{opacity:.35;cursor:default;}
  .cta{background:var(--gold);border:1px solid var(--gold);color:var(--navy-900);font-weight:700;padding:11px 22px;border-radius:2px;cursor:pointer;font-size:13px;letter-spacing:.02em;}
  .cta:hover{filter:brightness(1.05);}
  .cta.secondary{background:var(--navy-700);border-color:var(--navy-700);color:#fff;}
  .cta:disabled{opacity:.55;cursor:default;filter:none;}
  .ctaRow{display:flex;gap:12px;flex-wrap:wrap;}

  .summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:720px;margin-bottom:20px;}
  .sumcard{border:1px solid var(--ice-200);padding:16px;border-radius:3px;background:var(--ice-100);}
  .sumcard .n{font-family:var(--display);font-size:26px;color:var(--navy-900);}
  .sumcard .l{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5a6b80;margin-top:2px;}

  .gaugeInline{display:none;}

  @media (max-width:820px){
    .app{flex-direction:column;border-left:0;border-right:0;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:nowrap;align-items:center;padding:12px 14px;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .brand,.gauge{display:none;}
    nav.steps{flex-direction:row;flex-wrap:nowrap;gap:6px;flex:none;}
    .step{flex:0 0 auto;padding:8px 10px;white-space:nowrap;}
    .step .meta span{display:none;}
    .topbar{padding:16px 18px;}
    .stepWarning{padding:9px 18px;}
    .content{padding:18px 18px 90px;}
    .footer{padding:12px 18px;position:sticky;bottom:0;background:#fff;}
  }

  @media (max-width:600px){
    .topbar{flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;position:relative;}
    .topbar h1{font-size:18px;padding-right:50px;}
    .topbarLogo{position:absolute;top:12px;right:16px;height:44px;}
    .content{padding:16px 16px 100px;}
    .section-intro{font-size:12.5px;}

    .field{max-width:100%;}
    .qcard{padding:12px;}
    .qtext{font-size:13px;}
    .pill{padding:8px 12px;font-size:12px;}
    .lvl{width:38px;height:38px;font-size:12.5px;}
    .levelrow{gap:8px;}

    .summaryGrid{grid-template-columns:1fr 1fr;max-width:100%;}
    .ctaRow{flex-direction:column;}
    .cta{width:100%;text-align:center;padding:13px 18px;}

    .footer{flex-wrap:wrap;gap:8px;}
    .navbtn{flex:1;padding:11px 10px;}

    .gaugeInline{display:flex !important;align-items:center;gap:10px;padding:4px 2px 0;}
    .gaugeInline .track{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;}
    .gaugeInline .fill{height:100%;background:var(--gold);border-radius:3px;}
    .gaugeInline span{font-family:var(--mono);font-size:11px;color:#fff;flex-shrink:0;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">Instrumento de Autoevaluación Institucional
      <small>LOPDP · Madurez · Gobernanza TI</small>
    </div>
    <div class="gauge">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/>
        <circle id="gaugeArc" cx="48" cy="48" r="40" fill="none" stroke="#C9A227" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2"
          transform="rotate(-90 48 48)"/>
        <text id="gaugeText" x="48" y="54" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#fff">0%</text>
      </svg>
      <div class="gauge-label">Avance total</div>
    </div>
    <div class="gaugeInline">
      <span id="gaugeInlineTxt">0%</span>
      <div class="track"><div class="fill" id="gaugeInlineFill" style="width:0%"></div></div>
    </div>
    <nav class="steps" id="stepsNav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Portada</h1>
        <div class="sub" id="pageSub">Datos generales de la institución evaluada</div>
      </div>
      <img id="topbarLogo" class="topbarLogo" alt="Logo institucional">
    </div>
    <div id="stepWarning" class="stepWarning">⚠ Debes completar todas las preguntas de este paso antes de continuar.</div>
    <div class="content" id="content"></div>
    <div class="footer">
      <button class="navbtn" id="btnPrev">← Anterior</button>
      <button class="navbtn" id="btnNext">Siguiente →</button>
    </div>
  </main>
</div>

<script>
/* ============================================================
   1) DATOS DEL INSTRUMENTO
   ============================================================ */
const MODULE1 = [
 {t:"A. INVENTARIO Y BASES DE DATOS", items:[
  {id:"A1",art:"Art. 26, 11 y 37",q:"¿La institución ha identificado y registrado todas las bases de datos que contienen datos personales?"},
  {id:"A2",art:"Art. 11",q:"¿Se ha definido la finalidad específica de cada tratamiento de datos personales?"},
  {id:"A3",art:"Art. 10, 12",q:"¿Se documenta el período de conservación de los datos conforme a minimización y proporcionalidad?"},
  {id:"A4",art:"Art. 26",q:"¿Existe un inventario actualizado de flujos de datos (quién recibe, quién envía, con qué propósito)?"}]},
 {t:"B. CONSENTIMIENTO E INFORMACIÓN AL TITULAR", items:[
  {id:"B1",art:"Art. 14, 15",q:"¿Se informa al titular sobre qué datos se recopilan, cómo se usan y con quién se comparten?"},
  {id:"B2",art:"Art. 9",q:"¿Se obtiene el consentimiento explícito antes de recopilar o procesar datos personales?"},
  {id:"B3",art:"Art. 14",q:"¿Existe una política de privacidad clara, accesible y revisada periódicamente?"},
  {id:"B4",art:"Art. 19-25",q:"¿Se proporciona a los titulares información sobre cómo ejercer sus derechos (ARCO+)?"},
  {id:"B5",art:"Art. 8, 9 y 14",q:"¿Cuenta con política de uso de cookies con consentimiento informado?"}]},
 {t:"C. DERECHOS DE LOS TITULARES (ARCO+)", items:[
  {id:"C1",art:"Art. 19",q:"¿Existe un mecanismo formal para atender solicitudes de Acceso a datos personales?"},
  {id:"C2",art:"Art. 20",q:"¿Existe un mecanismo formal para solicitudes de Rectificación de datos?"},
  {id:"C3",art:"Art. 21",q:"¿Existe un mecanismo formal para solicitudes de Cancelación / Supresión de datos?"},
  {id:"C4",art:"Art. 22",q:"¿Existe un mecanismo formal para solicitudes de Oposición al tratamiento?"},
  {id:"C5",art:"Art. 19-26",q:"¿Se respetan los plazos legales para atender derechos de titulares?"}]},
 {t:"D. RESPONSABLE Y ENCARGADO DEL TRATAMIENTO", items:[
  {id:"D1",art:"Art. 47 - 50",q:"¿La institución tiene designado formalmente un Delegado de Protección de Datos (DPD)?"},
  {id:"D2",art:"Art. 38",q:"¿Cuenta con contratos firmados con encargados de tratamiento externos?"},
  {id:"D3",art:"Art. 38, 39",q:"¿Tiene acuerdos de confidencialidad firmados con encargados y colaboradores que acceden a datos?"},
  {id:"D4",art:"Art. 38",q:"¿Se verifica que los encargados externos cumplen con la LOPDP?"}]},
 {t:"E. SEGURIDAD DE LA INFORMACIÓN", items:[
  {id:"E1",art:"Art. 37",q:"¿Cuenta con medidas de seguridad técnicas y organizativas para proteger datos personales?"},
  {id:"E2",art:"Art. 37 y 40",q:"¿Realiza análisis de riesgos que incluya el tratamiento de datos personales?"},
  {id:"E3",art:"Art. 37 y 47",q:"¿Se realiza Evaluación de Impacto en Protección de Datos (EIPD) para tratamientos de alto riesgo?"},
  {id:"E4",art:"Art. 42 y 44",q:"¿Mantiene un procedimiento documentado para notificación de vulneraciones de seguridad?"},
  {id:"E5",art:"Art. 37 y 40",q:"¿Realiza análisis de vulnerabilidades informáticas relacionadas con datos personales?"},
  {id:"E6",art:"Art. 37",q:"¿Cuenta con políticas de anonimización, cifrado y eliminación segura de datos?"},
  {id:"E7",art:"Art. 14 y 37",q:"¿Tiene señalización visible en zonas con cámaras de seguridad?"}]},
 {t:"F. AUDITORÍA, CAPACITACIÓN Y MEJORA CONTINUA", items:[
  {id:"F1",art:"Art. 37",q:"¿Se realizan capacitaciones periódicas a docentes, autoridades, estudiantes sobre protección de datos?"},
  {id:"F2",art:"Art. 37 y 47",q:"¿Se realizan revisiones periódicas y auditorías de cumplimiento de protección de datos?"},
  {id:"F3",art:"Art. 10, 12 y 16",q:"¿Se ha documentado y aplica una política de retención y eliminación de datos?"},
  {id:"F4",art:"Art. 37 y 40",q:"¿Se realizan pruebas de penetración o análisis de seguridad informática?"}]}
];

const LEVEL_DESC = [
 "Inicial: Sin proceso formal. Acción ad hoc o inexistente.",
 "Básico: Se reconoce la necesidad pero sin estandarización.",
 "Definido: Proceso documentado, aprobado y aplicado consistentemente.",
 "Gestionado: Proceso medido con indicadores y métricas definidos.",
 "Optimizado: Mejora continua activa. Benchmarking y automatización."
];

const MODULE2 = [
 {t:"I. GOBERNANZA Y LIDERAZGO EN DATOS", items:[
  {id:"G1",q:"Existe una estructura de gobierno de datos con roles y responsabilidades definidos (Responsable, DPD, Encargados)."},
  {id:"G2",q:"La alta dirección lidera y está comprometida con el cumplimiento normativo en protección de datos."},
  {id:"G3",q:"Existen políticas institucionales formalizadas sobre privacidad y protección de datos personales."},
  {id:"G4",q:"Se cuenta con presupuesto asignado para actividades de cumplimiento y protección de datos."}]},
 {t:"II. GESTIÓN DE PROCESOS Y PROCEDIMIENTOS", items:[
  {id:"P1",q:"Los procesos de tratamiento de datos están documentados, aprobados y comunicados al personal."},
  {id:"P2",q:"Existe un registro de actividades de tratamiento (RAT) actualizado."},
  {id:"P3",q:"Se aplican procedimientos formales para responder derechos ARCO+ de los titulares."},
  {id:"P4",q:"Se dispone de procedimientos para gestión de incidentes y brechas de datos."},
  {id:"P5",q:"Existe un proceso de revisión y mejora continua de los procedimientos de protección de datos."}]},
 {t:"III. CULTURA Y CAPACITACIÓN ORGANIZACIONAL", items:[
  {id:"CC1",q:"El personal tiene conocimiento básico de la LOPDP y sus obligaciones."},
  {id:"CC2",q:"Se realizan capacitaciones formales y periódicas sobre protección de datos a todos los niveles."},
  {id:"CC3",q:"Existe una cultura de privacidad por diseño en el desarrollo de nuevos proyectos o sistemas."},
  {id:"CC4",q:"El incumplimiento de normas de privacidad tiene consecuencias formales (régimen disciplinario)."}]},
 {t:"IV. GESTIÓN DE RIESGOS Y SEGURIDAD", items:[
  {id:"R1",q:"Se realiza análisis de riesgos formal para el tratamiento de datos personales."},
  {id:"R2",q:"Los riesgos identificados tienen controles asignados, responsables y plazos de mitigación."},
  {id:"R3",q:"Se aplican Evaluaciones de Impacto en Protección de Datos (EIPD) cuando corresponde."},
  {id:"R4",q:"Las medidas de seguridad técnica (cifrado, control de acceso, logs) están implementadas y documentadas."},
  {id:"R5",q:"Se realizan pruebas periódicas de seguridad (pentesting, análisis de vulnerabilidades)."}]},
 {t:"V. RELACIÓN CON TERCEROS Y CADENA DE VALOR", items:[
  {id:"T1",q:"Los contratos con proveedores incluyen cláusulas de protección de datos."},
  {id:"T2",q:"Se verifica que los encargados externos cumplen con estándares equivalentes de protección de datos."},
  {id:"T3",q:"Existe un registro actualizado de encargados de tratamiento externos."}]},
 {t:"VI. AUDITORÍA, MONITOREO Y MEJORA CONTINUA", items:[
  {id:"A1",q:"Se realizan auditorías internas periódicas de cumplimiento en protección de datos."},
  {id:"A2",q:"Existen indicadores y métricas de cumplimiento que se monitorean regularmente."},
  {id:"A3",q:"Los hallazgos de auditoría se documentan, priorizan e implementan con seguimiento."},
  {id:"A4",q:"La institución aplica un ciclo de mejora continua (PHVA) en la gestión de datos personales."}]}
];

const MODULE3 = [
 {t:"I. ESTRATEGIA Y GOBERNANZA TI", items:[
  {id:"TG1",q:"¿Existe un plan estratégico de tecnología de la información (PETI) vigente y alineado al plan institucional?"},
  {id:"TG2",q:"¿Hay una unidad o responsable formal de TI con funciones y presupuesto definidos?"},
  {id:"TG3",q:"¿Existe un comité o instancia de toma de decisiones tecnológicas en la institución?"},
  {id:"TG4",q:"¿Se aplica algún marco de referencia para gobernanza TI (COBIT, ITIL, ISO 38500, ISO 27001 u otro)?"}]},
 {t:"II. INVENTARIO Y GESTIÓN DE ACTIVOS TECNOLÓGICOS", items:[
  {id:"TA1",q:"¿Se cuenta con un inventario actualizado de hardware (equipos, servidores, dispositivos de red)?"},
  {id:"TA2",q:"¿Se cuenta con un inventario actualizado de software y licencias?"},
  {id:"TA3",q:"¿Están identificados y clasificados los sistemas de información por criticidad?"},
  {id:"TA4",q:"¿Se gestiona el ciclo de vida de los activos tecnológicos (adquisición, operación, baja)?"}]},
 {t:"III. SISTEMAS DE INFORMACIÓN Y BASES DE DATOS", items:[
  {id:"SI1",q:"¿Los sistemas de información institucionales están documentados (arquitectura, flujos de datos, usuarios)?"},
  {id:"SI2",q:"¿Existe integración entre los sistemas de información? ¿Están documentados los flujos de integración?"},
  {id:"SI3",q:"¿Los sistemas aplican controles de acceso basados en roles (RBAC) o perfiles de usuario?"},
  {id:"SI4",q:"¿Se registran logs de auditoría en los sistemas de información (accesos, cambios, consultas)?"},
  {id:"SI5",q:"¿Los sistemas de información críticos cuentan con planes de continuidad o contingencia?"},
  {id:"SI6",q:"¿Se realizan respaldos periódicos de bases de datos y sistemas con pruebas de restauración?"}]},
 {t:"IV. SEGURIDAD INFORMÁTICA", items:[
  {id:"SEC1",q:"¿Existe una política de seguridad de la información documentada y vigente?"},
  {id:"SEC2",q:"¿Se aplica gestión de parches y actualizaciones de seguridad en sistemas operativos y aplicaciones?"},
  {id:"SEC3",q:"¿Se usan herramientas de protección perimetral (firewall, antivirus, IDS/IPS)?"},
  {id:"SEC4",q:"¿Existe segmentación de redes y control de acceso a la infraestructura?"},
  {id:"SEC5",q:"¿Se gestiona formalmente el control de accesos privilegiados (administradores de sistemas)?"},
  {id:"SEC6",q:"¿Se realizan pruebas de seguridad (pentesting, ethical hacking) periódicamente?"}]},
 {t:"V. GESTIÓN DE SERVICIOS TI Y MESA DE AYUDA", items:[
  {id:"SV1",q:"¿Existe un sistema de gestión de incidentes y solicitudes TI (mesa de ayuda / help desk)?"},
  {id:"SV2",q:"¿Se miden los tiempos de respuesta y resolución de incidentes tecnológicos?"},
  {id:"SV3",q:"¿Existen Acuerdos de Nivel de Servicio (SLA) con proveedores tecnológicos críticos?"},
  {id:"SV4",q:"¿Existe gestión de cambios formalizada para modificaciones en sistemas productivos?"}]},
 {t:"VI. NORMATIVA Y CUMPLIMIENTO TECNOLÓGICO NACIONAL", items:[
  {id:"CN1",q:"¿La gestión de TI está alineada con la Ley de Comercio Electrónico, Firmas y Mensajes de Datos?"},
  {id:"CN2",q:"¿Se aplica el Esquema Gubernamental de Seguridad de la Información (EGSI) o similar?"},
  {id:"CN3",q:"¿Los sistemas de información consideran requisitos de protección de datos desde su diseño (privacy by design)?"},
  {id:"CN4",q:"¿Se realiza revisión periódica del cumplimiento normativo tecnológico (auditorías TI)?"}]}
];

// Fecha de aplicación por defecto: el día de hoy (zona horaria local)
(function(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  state.portada.fecha = `${yyyy}-${mm}-${dd}`;
})();

const STEPS = [
  {key:"portada",label:"Portada",sub:"Datos generales",count:6},
  {key:"m1",label:"Módulo 1",sub:"Cumplimiento LOPDP",count:29},
  {key:"m2",label:"Módulo 2",sub:"Madurez institucional",count:25},
  {key:"m3",label:"Módulo 3",sub:"Gobernanza TI",count:28},
  {key:"final",label:"Generar",sub:"Descargar Excel",count:0}
];
let current = 0;

/* ============================================================
   3) RENDER
   ============================================================ */
const PORTADA_FIELDS = ['institucion','unidad','responsable','cargo','fecha','revisor'];
function countPortadaFields(){
  return PORTADA_FIELDS.filter(k => state.portada[k] && String(state.portada[k]).trim()).length + (state.portada.consentimiento ? 1 : 0);
}

function stepCounts(key){
  if(key==='portada') return {done:countPortadaFields(), total:7};
  if(key==='m1') return {done:Object.values(state.m1).filter(v=>v.resp).length, total:29};
  if(key==='m2') return {done:Object.values(state.m2).filter(v=>v.lvl>0).length, total:25};
  if(key==='m3') return {done:Object.values(state.m3).filter(v=>v.resp).length, total:28};
  return {done:0, total:0};
}
function stepComplete(idx){
  const key = STEPS[idx].key;
  if(key==='final') return true;
  const {done,total} = stepCounts(key);
  return done===total;
}
function allComplete(){
  return stepComplete(0) && stepComplete(1) && stepComplete(2) && stepComplete(3);
}
function firstIncompleteStep(){
  for(let i=0;i<4;i++){ if(!stepComplete(i)) return i; }
  return 4;
}

function countAnswered(){
  let done=0,total=0;
  total+=7; done+=countPortadaFields();
  total+=29; done+=Object.values(state.m1).filter(v=>v.resp).length;
  total+=25; done+=Object.values(state.m2).filter(v=>v.lvl>0).length;
  total+=28; done+=Object.values(state.m3).filter(v=>v.resp).length;
  return {done,total};
}

function updateGauge(){
  const {done,total} = countAnswered();
  const pct = total? Math.round((done/total)*100) : 0;
  const circ = 251.2;
  document.getElementById('gaugeArc').setAttribute('stroke-dashoffset', circ - (circ*pct/100));
  document.getElementById('gaugeText').textContent = pct+'%';
  document.getElementById('gaugeInlineTxt').textContent = pct+'%';
  document.getElementById('gaugeInlineFill').style.width = pct+'%';
}

function renderSteps(){
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = '';
  const maxReachable = Math.min(firstIncompleteStep(), STEPS.length-1);
  STEPS.forEach((s,idx)=>{
    let sub=s.sub, done=false;
    if(s.key!=='final'){ const {done:n,total} = stepCounts(s.key); done=(n===total); sub=n+'/'+total+(s.key==='portada'?' campos':(s.key==='m2'?' dimensiones':' criterios')); }
    const locked = idx > maxReachable;
    const div = document.createElement('div');
    div.className='step'+(idx===current?' active':'')+(done?' done':'')+(locked?' locked':'');
    div.innerHTML = `<div class="num">${done?'✓':(locked?'🔒':(idx+1))}</div><div class="meta"><b>${s.label}</b><span>${sub}</span></div>`;
    div.onclick=()=>{
      if(locked){ showStepWarning(); return; }
      current=idx; render();
    };
    nav.appendChild(div);
  });
}

function showStepWarning(){
  const el = document.getElementById('stepWarning');
  if(!el) return;
  el.style.display='block';
  clearTimeout(showStepWarning._t);
  showStepWarning._t = setTimeout(()=>{ el.style.display='none'; }, 3500);
}

function fieldRow(labelTxt, val, onInput, type, options){
  const wrap=document.createElement('div'); wrap.className='field';
  const label=document.createElement('label'); label.textContent=labelTxt; wrap.appendChild(label);
  let input;
  if(type==='select'){
    input=document.createElement('select');
    input.style.cssText='width:100%;border:1px solid var(--ice-300);background:var(--ice-100);padding:9px 11px;font-family:var(--body);font-size:13.5px;border-radius:2px;color:var(--ink);';
    const optEmpty=document.createElement('option'); optEmpty.value=''; optEmpty.textContent='Seleccione...'; input.appendChild(optEmpty);
    options.forEach(opt=>{
      const o=document.createElement('option'); o.value=opt; o.textContent=opt;
      if(opt===val) o.selected=true;
      input.appendChild(o);
    });
    input.onchange=(e)=>{onInput(e.target.value); updateGauge(); renderSteps();};
  } else {
    input=document.createElement(type==='textarea'?'textarea':'input');
    if(type!=='textarea') input.type=type||'text';
    input.value=val||'';
    input.oninput=(e)=>{onInput(e.target.value); updateGauge(); renderSteps();};
  }
  wrap.appendChild(input);
  return wrap;
}

function renderPortada(container){
  document.getElementById('pageTitle').textContent='Portada';
  document.getElementById('pageSub').textContent='Datos generales de la institución evaluada';
  const p=state.portada;

  const notice=document.createElement('div'); notice.className='privacyNotice';
  notice.innerHTML = `<strong>Aviso de Protección de Datos (Ley Orgánica de Protección de Datos Personales — LOPDP):</strong>
    La información registrada en este instrumento tiene fines exclusivamente académicos y de autoevaluación institucional.
    Los datos recopilados serán anonimizados y no se utilizarán para identificar a personas naturales ni para fines distintos al proceso de mejora interna.`;
  container.appendChild(notice);

  const consentWrap=document.createElement('label'); consentWrap.className='consentCheck';
  const consentInput=document.createElement('input'); consentInput.type='checkbox';
  consentInput.checked=!!p.consentimiento;
  consentInput.onchange=(e)=>{ p.consentimiento=e.target.checked; updateGauge(); renderSteps(); };
  consentWrap.appendChild(consentInput);
  const consentText=document.createElement('span');
  consentText.textContent='He leído el aviso anterior y estoy de acuerdo en utilizar la información para el tratamiento de los datos registrados en este instrumento, conforme la LOPDP.';
  consentWrap.appendChild(consentText);
  container.appendChild(consentWrap);

  container.appendChild(fieldRow('Institución', p.institucion, v=>p.institucion=v));
  container.appendChild(fieldRow('Tipo de Institución', p.unidad, v=>p.unidad=v, 'select', ['Particular','Fiscal','Fiscomisional']));
  container.appendChild(fieldRow('Responsable de la autoevaluación', p.responsable, v=>p.responsable=v));
  container.appendChild(fieldRow('Cargo', p.cargo, v=>p.cargo=v));
  container.appendChild(fieldRow('Fecha de aplicación', p.fecha, v=>p.fecha=v, 'date'));
  container.appendChild(fieldRow('Revisado por (Estudiantes Maestría en Seguridad Informática)', p.revisor, v=>p.revisor=v));
}

function renderYesNoModule(container, MODULE, storeObj, withPriority){
  MODULE.forEach(section=>{
    const h=document.createElement('div'); h.className='dim-title'; h.textContent=section.t;
    container.appendChild(h);
    section.items.forEach(item=>{
      const st = storeObj[item.id];
      const card=document.createElement('div'); card.className='qcard'+(st.resp?' answered':'');
      const head=document.createElement('div'); head.className='qhead';
      head.innerHTML=`<span class="qid">${item.id}</span><div><div class="qtext">${item.q}</div>${item.art?`<div class="qart">${item.art}</div>`:''}</div>`;
      card.appendChild(head);

      const pillrow=document.createElement('div'); pillrow.className='pillrow';
      ['Sí','Parcial','No'].forEach(v=>{
        const b=document.createElement('div'); b.className='pill'+(st.resp===v?' sel':''); b.dataset.v=v; b.textContent=v;
        b.onclick=()=>{st.resp=v; renderCurrent(); updateGauge(); renderSteps();};
        pillrow.appendChild(b);
      });
      card.appendChild(pillrow);

      const miniLabel=document.createElement('div'); miniLabel.className='miniLabel';
      miniLabel.textContent = withPriority ? 'Estado actual / observación' : 'Evidencia / observación';
      card.appendChild(miniLabel);
      const ta=document.createElement('textarea');
      ta.value=st.ev; ta.placeholder='Describe brevemente la evidencia disponible...';
      ta.oninput=(e)=>{st.ev=e.target.value;};
      card.appendChild(ta);

      if(withPriority){
        const prow=document.createElement('div'); prow.className='pillrow prioRow';
        const lbl=document.createElement('div'); lbl.className='miniLabel'; lbl.textContent='Prioridad'; card.appendChild(lbl);
        ['Alta','Media','Baja'].forEach(v=>{
          const b=document.createElement('div'); b.className='pill'+(st.prio===v?' sel':''); b.dataset.v=v; b.textContent=v;
          b.onclick=()=>{st.prio=v; renderCurrent();};
          prow.appendChild(b);
        });
        card.appendChild(prow);
      }
      container.appendChild(card);
    });
  });
}

  document.getElementById('pageSub').textContent='Descarga el Excel completo o el informe ejecutivo en PDF';
  const complete = allComplete();

    ok.style.color='#2E7D4F';
    ok.textContent='Instrumento completo. Listo para generar el reporte final.';
    container.appendChild(ok);

  renderConsentimientoDigital(container);

  const row=document.createElement('div'); row.className='ctaRow';
  const btn=document.createElement('button'); btn.className='cta'; btn.textContent='📊 Generar Excel completo';

  btn.onclick=generarExcel;
  row.appendChild(btn);
  const btnPdf=document.createElement('button'); btnPdf.className='cta secondary'; btnPdf.textContent='📄 Generar informe PDF';
  btnPdf.disabled=!readyToGenerate;

function renderConsentimientoDigital(container){
  const cd = state.consentDigital;

  const title=document.createElement('div'); title.className='dim-title'; title.style.marginTop='34px';

function renderCurrent(){
  const container=document.getElementById('content');
  const scrollPos = container.scrollTop;
  container.innerHTML='';
  const key=STEPS[current].key;
  if(key==='portada') renderPortada(container);
  else if(key==='m1') renderModule1(container);
  else if(key==='m2') renderModule2(container);
  else if(key==='m3') renderModule3(container);
  else renderFinal(container);
  container.scrollTop = scrollPos;
  document.getElementById('btnPrev').disabled = current===0;
  document.getElementById('btnNext').style.visibility = current===STEPS.length-1 ? 'hidden':'visible';
}

function render(){
  const tl=document.getElementById('topbarLogo');
  if(state.portada.logoDataUrl){ tl.src=state.portada.logoDataUrl; tl.style.display='block'; }
  else { tl.style.display='none'; }
  renderSteps(); renderCurrent(); updateGauge();
}

document.getElementById('btnPrev').onclick=()=>{ if(current>0){current--; render();} };
document.getElementById('btnNext').onclick=()=>{
  if(current<STEPS.length-1){
    if(!stepComplete(current)){ showStepWarning(); return; }
    current++; render();
  }
};

const PAL = {
  navy:'FF1B2A4A', orange:'FFF39C12', orange2:'FFE67E22', slate:'FF566573',
  darkRed:'FFC0392B', maroon:'FF8B0000', darkBlue:'FF1A5276', green:'FF1E8449',
  white:'FFFFFFFF', black:'FF000000',
  inputYellow:'FFFFFDE7', inputBlue:'FFE8F4FD', inputBlue2:'FFEBF5FB',
  lightGreen:'FFD5F5E3', lightRed:'FFFFCDD2', lightRed2:'FFFFEBEE',
  lightOrange:'FFFFE0B2', lightOrange2:'FFFDEBD0', lightYellow2:'FFFFF9C4',
  lightBlue2:'FFD6EAF8', lightBlue3:'FFB2EBF2', lightGreen2:'FFDCEDC8',
  grayRow:'FFECF0F1'
};

function styleCell(cell, o={}){
  if(o.bg) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:o.bg}};
  cell.font = {name:o.name||'Arial', size:o.size||10, bold:!!o.bold, italic:!!o.italic, color:{argb:o.color||PAL.black}};
  cell.alignment = {horizontal:o.align||'left', vertical:o.valign||'middle', wrapText:!!o.wrap};
  if(o.numFmt) cell.numFmt = o.numFmt;
}
function mergeStyled(ws, range, value, o){
  ws.mergeCells(range);
  const cell = ws.getCell(range.split(':')[0]);
  cell.value = value;
  styleCell(cell, o);
}
function unlock(cell){ cell.protection = {locked:false}; }

/* ---------- MÓDULO 1 y MÓDULO 3 (Sí/Parcial/No) ---------- */
function buildYesNoSheet(wb, cfg){
  // cfg: {sheetName, title, subtitle, headerColor, sectionColor, MODULE, storeObj, withPriority, rows:{sections:[[title,startRow]], questionRowMap:{id:row}}, sumRow, artOrPrioCol}
  const ws = wb.addWorksheet(cfg.sheetName);
  ws.columns = [{width:3},{width:5},{width:8},{width:60},{width:17},{width:36},{width:20}];

  mergeStyled(ws,`B2:G2`, cfg.title, {bg:cfg.headerColor,color:PAL.white,bold:true,size:14,align:'center'});
  mergeStyled(ws,`B3:G3`, cfg.subtitle, {bg:cfg.headerColor,color:PAL.white,align:'center'});

  const headers = cfg.withPriority
    ? ['#','ID','CRITERIO DE GOBERNANZA TECNOLÓGICA','RESPUESTA\n(Sí / Parcial / No)','ESTADO ACTUAL / OBSERVACIÓN','PRIORIDAD\n(Alta/Media/Baja)']
    : ['#','ID','CRITERIO DE VERIFICACIÓN','RESPUESTA\n(Sí / Parcial / No)','EVIDENCIA / OBSERVACIÓN','ART. LOPDP\nReferencia'];
  ['B','C','D','E','F','G'].forEach((col,i)=>{
    const c = ws.getCell(`${col}5`); c.value = headers[i];
    styleCell(c,{bg:cfg.headerColor,color:PAL.white,bold:true,align:'center',wrap:true});
  });

  cfg.sections.forEach(([title,row])=>{
    mergeStyled(ws, `B${row}:G${row}`, title, {bg:cfg.sectionColor,color:PAL.white,bold:true});
  });

  let idx=1;
  cfg.items.forEach(({row,id,q,art})=>{
    const st = cfg.storeObj[id];
    ws.getCell(`B${row}`).value = idx;
    ws.getCell(`C${row}`).value = id;
    ws.getCell(`D${row}`).value = q;
    [`B${row}`,`C${row}`,`D${row}`].forEach(a=>styleCell(ws.getCell(a),{align: a[0]==='D'?'left':'center', wrap:a[0]==='D'}));
    ws.getCell(`C${row}`).font = {name:'Arial',size:9,bold:true,color:{argb:cfg.headerColor}};

    const eCell = ws.getCell(`E${row}`);
    eCell.value = st.resp||'';
    styleCell(eCell,{bg:PAL.inputYellow,align:'center'});
    unlock(eCell);

    const fCell = ws.getCell(`F${row}`);
    fCell.value = st.ev||'';
    styleCell(fCell,{align:'left', wrap:true});
    unlock(fCell);

    const gCell = ws.getCell(`G${row}`);
    if(cfg.withPriority){
      gCell.value = st.prio||'';
      styleCell(gCell,{bg:PAL.inputBlue2, align:'center'});
      unlock(gCell);
    } else {
      gCell.value = art||'';
      styleCell(gCell,{align:'center', color:PAL.slate, wrap:true});
    }
    idx++;
  });

  // Fila de etiquetas y resumen
  const lr = cfg.sumRow-1;
  ['E','F','G'].forEach((col,i)=>{
    const c = ws.getCell(`${col}${lr}`); c.value = ['Sí ✓','Parcial ~','No ✗'][i];
    styleCell(c,{bg:PAL.grayRow, bold:true, align:'center'});
  });
  ws.getCell(`H${lr}`).value='% Cumplimiento'; styleCell(ws.getCell(`H${lr}`),{bg:PAL.grayRow,bold:true,align:'center'});

  const first = cfg.items[0].row, last = cfg.items[cfg.items.length-1].row;
  const total = cfg.items.length;
  const siCount = cfg.items.filter(it=>cfg.storeObj[it.id].resp==='Sí').length;
  const pCount  = cfg.items.filter(it=>cfg.storeObj[it.id].resp==='Parcial').length;
  const noCount = cfg.items.filter(it=>cfg.storeObj[it.id].resp==='No').length;
  const pct = (siCount*2+pCount)/(total*2);

  mergeStyled(ws, `B${cfg.sumRow}:D${cfg.sumRow}`, cfg.resumenLabel, {bg:PAL.maroon,color:PAL.white,bold:true,align:'center'});
  const eS=ws.getCell(`E${cfg.sumRow}`); eS.value={formula:`COUNTIF(E${first}:E${last},"Sí")`, result:siCount}; styleCell(eS,{bg:PAL.green,color:PAL.white,bold:true,align:'center'});
  const fS=ws.getCell(`F${cfg.sumRow}`); fS.value={formula:`COUNTIF(E${first}:E${last},"Parcial")`, result:pCount}; styleCell(fS,{bg:cfg.headerColor==PAL.darkBlue?PAL.darkBlue:PAL.orange2,color:PAL.white,bold:true,align:'center'});
  const gS=ws.getCell(`G${cfg.sumRow}`); gS.value={formula:`COUNTIF(E${first}:E${last},"No")`, result:noCount}; styleCell(gS,{bg:cfg.headerColor,color:PAL.white,bold:true,align:'center'});
  const hS=ws.getCell(`H${cfg.sumRow}`);
  hS.value={formula:`IFERROR((COUNTIF(E${first}:E${last},"Sí")*2+COUNTIF(E${first}:E${last},"Parcial")*1)/(${total}*2),0)`, result:pct};
  styleCell(hS,{bg:PAL.maroon,color:PAL.white,bold:true,align:'center',numFmt:'0.0%'});

  // Validaciones de datos (listas desplegables)
  cfg.items.forEach(({row})=>{
    ws.getCell(`E${row}`).dataValidation = {type:'list', allowBlank:true, formulae:['"Sí,Parcial,No"']};
    if(cfg.withPriority) ws.getCell(`G${row}`).dataValidation = {type:'list', allowBlank:true, formulae:['"Alta,Media,Baja"']};
  });

  // Formato condicional Sí/Parcial/No
  const rangeRef = `E${first}:E${last}`;
  ws.addConditionalFormatting({ref:rangeRef, rules:[
    {type:'cellIs', operator:'equal', formulae:['"Sí"'], priority:1, style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFC6EFCE'}}, font:{color:{argb:'FF006100'}}}},
    {type:'cellIs', operator:'equal', formulae:['"Parcial"'], priority:2, style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFFEB9C'}}, font:{color:{argb:'FF9C6500'}}}},
    {type:'cellIs', operator:'equal', formulae:['"No"'], priority:3, style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFFC7CE'}}, font:{color:{argb:'FF9C0006'}}}},
  ]});

  ws.protect('', {selectLockedCells:true, selectUnlockedCells:true});
  return {ws, sumRow:cfg.sumRow, si:siCount, parcial:pCount, no:noCount, pct};
}

  ['#','DIM','DIMENSIÓN / CRITERIO DE MADUREZ','NIVEL\n(1-5)','OBSERVACIÓN / JUSTIFICACIÓN','DESCRIPCIÓN DEL NIVEL SELECCIONADO'].forEach((h,i)=>{
    const col=['B','C','D','E','F','G'][i]; const c=ws.getCell(`${col}5`); c.value=h;
    styleCell(c,{bg:PAL.orange2,color:PAL.white,bold:true,align:'center',wrap:true});
  });

  const SECTIONS2 = [[7,MODULE2[0]],[14,MODULE2[1]],[22,MODULE2[2]],[29,MODULE2[3]],[37,MODULE2[4]],[43,MODULE2[5]]];
  const ROWSTART2 = {7:9,14:16,22:24,29:31,37:39,43:45};
  const items=[];
  SECTIONS2.forEach(([row,section])=>{
    mergeStyled(ws,`B${row}:G${row}`, section.t, {bg:PAL.orange2,color:PAL.white,bold:true});
    let r = ROWSTART2[row];
    section.items.forEach((it,i)=>{ items.push({...it,row:r+i}); });
  });

  items.forEach((it,i)=>{
    const st = state.m2[it.id]; const r=it.row;
    ws.getCell(`B${r}`).value=i+1; ws.getCell(`C${r}`).value=it.id; ws.getCell(`D${r}`).value=it.q;
    [`B${r}`,`C${r}`,`D${r}`].forEach(a=>styleCell(ws.getCell(a),{align:a[0]==='D'?'left':'center',wrap:a[0]==='D'}));
    ws.getCell(`C${r}`).font={name:'Arial',size:9,bold:true,color:{argb:PAL.orange2}};

    const eCell=ws.getCell(`E${r}`); eCell.value= st.lvl||''; styleCell(eCell,{bg:PAL.inputYellow,align:'center',bold:true});
    unlock(eCell);
    eCell.dataValidation = {type:'list', allowBlank:true, formulae:['"1,2,3,4,5"']};

    const fCell=ws.getCell(`F${r}`); fCell.value= st.obs||''; styleCell(fCell,{wrap:true}); unlock(fCell);

    const gCell=ws.getCell(`G${r}`);
    const formula = `IF(E${r}="","— Sin calificar —",CHOOSE(E${r},"${LEVEL_DESC[0]}","${LEVEL_DESC[1]}","${LEVEL_DESC[2]}","${LEVEL_DESC[3]}","${LEVEL_DESC[4]}"))`;
    gCell.value = {formula, result: st.lvl? LEVEL_DESC[st.lvl-1] : '— Sin calificar —'};
    styleCell(gCell,{italic:true, color:PAL.slate, wrap:true});
  });

  ws.addConditionalFormatting({
    ref:`E${items[0].row}:E${items[items.length-1].row}`,
    rules:[{type:'colorScale', priority:1, cfvo:[{type:'num',val:1},{type:'num',val:3},{type:'num',val:5}],
            color:[{argb:'FFF8696B'},{argb:'FFFFEB84'},{argb:'FF63BE7B'}]}]
  });

  const sumRow=51, lr=50;
  ['Nivel Promedio','Nivel Mínimo','Nivel Máximo'].forEach((t,i)=>{
    const c=ws.getCell(`${['E','F','G'][i]}${lr}`); c.value=t; styleCell(c,{bg:PAL.grayRow,bold:true,align:'center'});
  });
  ws.getCell(`H${lr}`).value='% Madurez Global'; styleCell(ws.getCell(`H${lr}`),{bg:PAL.grayRow,bold:true,align:'center'});

  const levels = items.map(it=>state.m2[it.id].lvl).filter(l=>l>0);
  const avg = levels.length? levels.reduce((a,b)=>a+b,0)/levels.length : 0;
  const min = levels.length? Math.min(...levels):0, max = levels.length? Math.max(...levels):0;
  const first=items[0].row, last=items[items.length-1].row;

  mergeStyled(ws,`B${sumRow}:D${sumRow}`,'RESUMEN MÓDULO 2',{bg:PAL.orange2,color:PAL.white,bold:true,align:'center'});
  const eC=ws.getCell(`E${sumRow}`); eC.value={formula:`IFERROR(AVERAGE(E${first}:E${last}),0)`, result:avg}; styleCell(eC,{bg:PAL.orange2,color:PAL.white,bold:true,align:'center',numFmt:'0.0'});
  const fC=ws.getCell(`F${sumRow}`); fC.value={formula:`IFERROR(MIN(E${first}:E${last}),0)`, result:min}; styleCell(fC,{bg:PAL.orange2,color:PAL.white,bold:true,align:'center'});
  const gC=ws.getCell(`G${sumRow}`); gC.value={formula:`IFERROR(MAX(E${first}:E${last}),0)`, result:max}; styleCell(gC,{bg:PAL.orange2,color:PAL.white,bold:true,align:'center'});
  const hC=ws.getCell(`H${sumRow}`); hC.value={formula:`IFERROR(AVERAGE(E${first}:E${last})/5,0)`, result:avg/5}; styleCell(hC,{bg:PAL.orange2,color:PAL.white,bold:true,align:'center',numFmt:'0.0%'});

  ws.protect('', {selectLockedCells:true, selectUnlockedCells:true});
  return {ws, sumRow, avg, min, max, pctMadurez:avg/5};
}

/* ---------- ENSAMBLADO ---------- */
function withRows(MODULE, rowMap){
  const items=[];
  MODULE.forEach(section=>{
    const startRow = rowMap[section.t];
    section.items.forEach((it,i)=> items.push({...it, row:startRow+i}));
  });
  return items;
}

async function generarExcel(){
  const btn = document.querySelector('.cta');
  const originalTxt = btn ? btn.textContent : null;
  if(btn){ btn.textContent='Generando…'; btn.disabled=true; }
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Instrumento de Autoevaluación Institucional';

    buildPortada(wb);
    buildConsentimiento(wb);

    const m1RowMap = {
      'A. INVENTARIO Y BASES DE DATOS':9,
      'B. CONSENTIMIENTO E INFORMACIÓN AL TITULAR':16,
      'C. DERECHOS DE LOS TITULARES (ARCO+)':24,
      'D. RESPONSABLE Y ENCARGADO DEL TRATAMIENTO':32,
      'E. SEGURIDAD DE LA INFORMACIÓN':39,
      'F. AUDITORÍA, CAPACITACIÓN Y MEJORA CONTINUA':49,
    };
    const m1Sections = MODULE1.map(s=>[m1RowMap[s.t]-2, s]); // fila de título 2 antes del primer ítem
    const m1Items = withRows(MODULE1, m1RowMap);
    const m1res = buildYesNoSheet(wb, {
      sheetName:'M1_Cumplimiento_LOPDP',
      title:'MÓDULO 1 · DIAGNÓSTICO DE CUMPLIMIENTO NORMATIVO — LOPDP Y RGLOPDP',
      subtitle:'Ley Orgánica de Protección de Datos Personales · Ecuador  |  Responda con base en evidencia disponible',
      headerColor:PAL.darkRed, sectionColor:PAL.darkRed,
      sections:[[MODULE1[0].t,7],[MODULE1[1].t,14],[MODULE1[2].t,22],[MODULE1[3].t,30],[MODULE1[4].t,37],[MODULE1[5].t,47]],
      items:m1Items, storeObj:state.m1, withPriority:false, sumRow:55, resumenLabel:'RESUMEN MÓDULO 1'
    });

    const m2res = buildModule2(wb);

    const m3RowMap = {
      'I. ESTRATEGIA Y GOBERNANZA TI':9,
      'II. INVENTARIO Y GESTIÓN DE ACTIVOS TECNOLÓGICOS':19,
      'III. SISTEMAS DE INFORMACIÓN Y BASES DE DATOS':26,
      'IV. SEGURIDAD INFORMÁTICA':35,
      'V. GESTIÓN DE SERVICIOS TI Y MESA DE AYUDA':44,
      'VI. NORMATIVA Y CUMPLIMIENTO TECNOLÓGICO NACIONAL':51,
    };
    // La sección I de M3 tiene un espacio extra entre criterios en el original
    const m3Items = [];
    let r = 9;
    MODULE3[0].items.forEach(it=>{ m3Items.push({...it,row:r}); r+=2; });
    MODULE3.slice(1).forEach(section=>{
      const start = m3RowMap[section.t];
      section.items.forEach((it,i)=> m3Items.push({...it, row:start+i}));
    });
    const m3res = buildYesNoSheet(wb, {
      sheetName:'M3_Gobernanza_Tecnologica',
      title:'MÓDULO 3 · GOBERNANZA TECNOLÓGICA Y SISTEMAS DE INFORMACIÓN',
      subtitle:'Evaluación de la gestión de procesos tecnológicos, infraestructura y sistemas de información',
      headerColor:PAL.darkBlue, sectionColor:PAL.darkBlue,
      sections:[[MODULE3[0].t,7],[MODULE3[1].t,17],[MODULE3[2].t,24],[MODULE3[3].t,33],[MODULE3[4].t,42],[MODULE3[5].t,49]],
      items:m3Items, storeObj:state.m3, withPriority:true, sumRow:57, resumenLabel:'RESUMEN MÓDULO 3'
    });

    buildTablero(wb, m1res, m2res, m3res);

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Autoevaluacion_'+(state.portada.institucion? state.portada.institucion.replace(/[^a-zA-Z0-9]+/g,'_') : 'Institucional')+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(err){
    console.error(err);
    alert('Ocurrió un error generando el Excel: '+err.message);
  } finally {
    if(btn){ btn.textContent=originalTxt; btn.disabled=false; }
  }
}

function getRoadmapBand(moduleKey, pct){
  // Bandas: 0-30%, 30-60%, 60-90%, 90-100% (la banda "100%" de la hoja original
  // se interpreta como el tramo superior de mejora continua, 90% en adelante)
  const bands = ROADMAP[moduleKey];
  if(pct < 0.30) return bands[0];
  if(pct < 0.60) return bands[1];
  if(pct < 0.90) return bands[2];
  return bands[3];
}

/* ============================================================
   6) GENERACIÓN DEL INFORME EJECUTIVO (PDF)
   ============================================================ */
function computeResults(){
  const items1 = MODULE1.flatMap(s=>s.items);
  const si1 = items1.filter(i=>state.m1[i.id].resp==='Sí').length;
  const p1  = items1.filter(i=>state.m1[i.id].resp==='Parcial').length;
  const no1 = items1.filter(i=>state.m1[i.id].resp==='No').length;
  const pct1 = (si1*2+p1)/(items1.length*2);

  const items3 = MODULE3.flatMap(s=>s.items);
  const si3 = items3.filter(i=>state.m3[i.id].resp==='Sí').length;
  const p3  = items3.filter(i=>state.m3[i.id].resp==='Parcial').length;
  const no3 = items3.filter(i=>state.m3[i.id].resp==='No').length;
  const pct3 = (si3*2+p3)/(items3.length*2);

  const items2 = MODULE2.flatMap(s=>s.items);
  const levels = items2.map(i=>state.m2[i.id].lvl).filter(l=>l>0);
  const avg = levels.length? levels.reduce((a,b)=>a+b,0)/levels.length : 0;
  const min = levels.length? Math.min(...levels):0, max = levels.length? Math.max(...levels):0;
  const pctMadurez = avg/5;

  const globalIdx = (pct1+pct3+pctMadurez)/3;
  const riesgoTxt = globalIdx<0.4?'Riesgo Alto — Acción inmediata':globalIdx<0.6?'Riesgo Medio-Alto — Brechas críticas':globalIdx<0.75?'Riesgo Medio — Brechas puntuales':'Riesgo Bajo — Gestión consolidada';

  const hallazgosNo = [];
  MODULE1.forEach(s=>s.items.forEach(i=>{ if(state.m1[i.id].resp==='No') hallazgosNo.push(['Módulo 1', i.id, i.q]); }));
  MODULE3.forEach(s=>s.items.forEach(i=>{ if(state.m3[i.id].resp==='No') hallazgosNo.push(['Módulo 3', i.id, i.q]); }));
  const dimDebiles = [];
  MODULE2.forEach(s=>s.items.forEach(i=>{ const lvl=state.m2[i.id].lvl; if(lvl>0 && lvl<=2) dimDebiles.push(['Módulo 2', i.id, i.q, lvl]); }));

  return {
    m1:{si:si1,parcial:p1,no:no1,pct:pct1,total:items1.length},
    m3:{si:si3,parcial:p3,no:no3,pct:pct3,total:items3.length},
    m2:{avg,min,max,pctMadurez,total:items2.length},
    globalIdx, riesgoTxt, hallazgosNo, dimDebiles
  };
}

function pctFmt(v){ return (v*100).toFixed(1)+'%'; }
function colorForPct(v){
  if(v<0.4) return [178,58,58];
  if(v<0.6) return [184,134,11];
  if(v<0.8) return [214,137,16];
  return [46,125,79];
}

function drawKPI(doc, x, y, label, value, color){
  const w=56, h=32;
  doc.setDrawColor(220,226,233); doc.setLineWidth(0.3);
  doc.roundedRect(x,y,w,h,1.5,1.5,'S');
  doc.setFillColor(...color); doc.rect(x,y,3,h,'F');
  doc.setTextColor(90,107,128); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text(label, x+8, y+10, {maxWidth:w-12});
  doc.setTextColor(...color); doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text(value, x+8, y+23);
}

async function generarPDF(){
  const btn = document.querySelector('.cta.secondary');
  const originalTxt = btn ? btn.textContent : null;
  if(btn){ btn.textContent='Generando…'; btn.disabled=true; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const NAVY=[27,42,74], GOLD=[184,145,43], SLATE=[90,107,128], INK=[22,32,46];
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 18;
    const res = computeResults();
    const inst = state.portada.institucion || '[Institución no especificada]';

    const addFooter = ()=>{
      const p = doc.internal.getNumberOfPages();
      doc.setFontSize(8); doc.setTextColor(...SLATE); doc.setFont('helvetica','normal');
      doc.text('Instrumento de Autoevaluación Institucional · Confidencial — uso interno', margin, pageH-10);
      doc.text('Página '+p, pageW-margin, pageH-10, {align:'right'});
    };

    const hasLogo = !!state.portada.logoDataUrl;
    let textCenterX = pageW/2, textMaxW = pageW-40;
    let cardX=margin, cardY=10, cardW=0, cardH=0, padX=6, padY=6;

    if(hasLogo){
      const maxH=26, maxW=24;
      let w=state.portada.logoW||100, h=state.portada.logoH||40;
      const ratio=Math.min(maxW/w, maxH/h);
      w=w*ratio; h=h*ratio;
      cardW=w+padX*2; cardH=h+padY*2;
      const textX = cardX + cardW + 12;
      textCenterX = textX + (pageW - margin - textX)/2;
      textMaxW = pageW - margin - textX - 4;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(hasLogo?15:20);
    const titleLines = doc.splitTextToSize('INFORME EJECUTIVO DE AUTOEVALUACIÓN', textMaxW);
    const titleLH = hasLogo?6.2:8.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(hasLogo?10:12);
    const subLines = doc.splitTextToSize('Cumplimiento LOPDP · Madurez Institucional · Gobernanza Tecnológica', textMaxW);
    const subLH = hasLogo?4.6:5.5;

    const textBlockH = titleLines.length*titleLH + 4 + subLines.length*subLH + 10 + 8;
    const bandH = Math.max(hasLogo? cardH+20 : 72, textBlockH + 20);

    doc.setFillColor(...NAVY); doc.rect(0,0,pageW,bandH,'F');
    if(hasLogo){
      cardY = (bandH-cardH)/2;
      doc.setFillColor(255,255,255);
      doc.roundedRect(cardX, cardY, cardW, cardH, 2.5, 2.5, 'F');
      const w2=cardW-padX*2, h2=cardH-padY*2;
      try{ doc.addImage(state.portada.logoDataUrl, state.portada.logoType==='png'?'PNG':'JPEG', cardX+padX, cardY+padY, w2, h2); }catch(e){ console.error('Logo error', e); }
    }

    let cy = (bandH - textBlockH)/2 + titleLH*0.7;
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(hasLogo?15:20);
    doc.text(titleLines, textCenterX, cy, {align:'center'});
    cy += titleLines.length*titleLH - (titleLH-titleLH*0.7) + 4;

    doc.setFontSize(hasLogo?10:12); doc.setFont('helvetica','normal');
    doc.text(subLines, textCenterX, cy, {align:'center'});
    cy += subLines.length*subLH + 6;

    doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(textCenterX-28,cy,textCenterX+28,cy);
    cy += 10;

    doc.setFontSize(hasLogo?10:12); doc.setFont('helvetica','bold');
    doc.text(inst, textCenterX, cy, {align:'center', maxWidth:textMaxW});

    let y = bandH + 16;
    doc.setTextColor(...INK);
    doc.autoTable({
      startY:y, theme:'plain', styles:{fontSize:10, textColor:INK, cellPadding:1.5},
      columnStyles:{0:{fontStyle:'bold', textColor:SLATE, cellWidth:65}},
      body:[
        ['Tipo de Institución', state.portada.unidad||'—'],
        ['Responsable de la autoevaluación', state.portada.responsable||'—'],
        ['Cargo', state.portada.cargo||'—'],
        ['Fecha de aplicación', state.portada.fecha||'—'],
        ['Revisado por', state.portada.revisor||'—'],
      ],
      margin:{left:margin,right:margin}
    });
    y = doc.lastAutoTable.finalY + 14;

    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...NAVY);
    doc.text('INDICADORES CLAVE', margin, y); y+=6;
    drawKPI(doc, margin,      y, 'CUMPLIMIENTO LOPDP',      pctFmt(res.m1.pct),      colorForPct(res.m1.pct));
    drawKPI(doc, margin+62,   y, 'MADUREZ INSTITUCIONAL',   res.m2.avg.toFixed(1)+' / 5', colorForPct(res.m2.pctMadurez));
    drawKPI(doc, margin+124,  y, 'GOBERNANZA TI',           pctFmt(res.m3.pct),      colorForPct(res.m3.pct));
    y += 40;

    doc.setFillColor(...NAVY); doc.roundedRect(margin, y, pageW-margin*2, 26, 1.5, 1.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('ÍNDICE DE CUMPLIMIENTO GLOBAL', margin+8, y+10);
    doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text(pctFmt(res.globalIdx), margin+8, y+20);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...GOLD);
    doc.text(res.riesgoTxt, pageW-margin-8, y+16, {align:'right'});
    y += 26+10;

    addFooter();

    doc.addPage();
    y = 20;
    doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text('1. Resumen por módulo', margin, y); y+=8;
    doc.autoTable({
      startY:y,
      head:[['Módulo','% Cumplimiento / Madurez','Sí','Parcial','No']],
      body:[
        ['Módulo 1 · Cumplimiento LOPDP/RGLOPDP', pctFmt(res.m1.pct), String(res.m1.si), String(res.m1.parcial), String(res.m1.no)],
        ['Módulo 2 · Madurez Institucional', res.m2.avg.toFixed(1)+' / 5  ('+pctFmt(res.m2.pctMadurez)+')', '—','—','—'],
        ['Módulo 3 · Gobernanza Tecnológica', pctFmt(res.m3.pct), String(res.m3.si), String(res.m3.parcial), String(res.m3.no)],
      ],
      headStyles:{fillColor:NAVY, textColor:255, fontSize:9.5},
      bodyStyles:{fontSize:9.5, textColor:INK},
      alternateRowStyles:{fillColor:[238,244,250]},
      margin:{left:margin,right:margin}
    });
    y = doc.lastAutoTable.finalY + 12;

    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...NAVY);

        startY:y+4,

        columnStyles:{0:{cellWidth:26},1:{cellWidth:16}},
        alternateRowStyles:{fillColor:[253,240,240]},
        margin:{left:margin,right:margin}

      y = doc.lastAutoTable.finalY + 10;

    if(res.dimDebiles.length>0){

          ['Responsables sugeridos', band.responsables],
          ['Criterio para avanzar de rango', band.criterio],
        ],
        theme:'grid',
        styles:{fontSize:8.3, textColor:INK, cellPadding:3, valign:'top'},
        columnStyles:{0:{fontStyle:'bold', textColor:mod.color, cellWidth:38, fillColor:[248,249,250]}, 1:{cellWidth:pageW-margin*2-38}},
        margin:{left:margin,right:margin}
      });
      y = doc.lastAutoTable.finalY + 10;
    });

    y += 2;
    doc.setDrawColor(220,226,233); doc.setLineWidth(0.3); doc.line(margin,y,pageW-margin,y); y+=10;
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...SLATE);
    const nota = 'Este informe fue generado automáticamente a partir de las respuestas registradas en el Instrumento de Autoevaluación Institucional. La hoja de ruta por módulo proviene del Modelo de Madurez LOPDP institucional. Para el detalle completo de los 82 criterios evaluados, consulte el archivo Excel adjunto.';
    const notaLines = doc.splitTextToSize(nota, pageW-margin*2);
    doc.text(notaLines, margin, y);
    y += notaLines.length*4.5 + 24;

    addFooter();
    doc.addPage();
    y = 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...NAVY);
    doc.text('4. Formato de consentimiento digital', margin, y); y+=8;

    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...GOLD);
    doc.text('1.1.1. FORMATO DE CONSENTIMIENTO DIGITAL', margin, y); y+=8;

    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...NAVY);
    doc.text('1. ACEPTACIÓN', margin, y); y+=6;

    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK);
    const aceptLines = doc.splitTextToSize('Declaro que he leído y comprendido la información contenida en el presente consentimiento informado y que he sido informado/a de manera clara, suficiente y comprensible sobre el tratamiento de mis datos personales.', pageW-margin*2);
    doc.text(aceptLines, margin, y); y += aceptLines.length*4.3 + 8;

    const cd = state.consentDigital;
    [
      [cd.tratamiento, 'ACEPTO el tratamiento de mis datos personales para las finalidades descritas en el presente consentimiento informado.'],
      [cd.imagen, 'ACEPTO el uso de imagen, fotografía y/o material audiovisual, cuando aplique.'],
      [cd.sensibles, 'ACEPTO el tratamiento de datos sensibles, cuando aplique.']
    ].forEach(([checked,label])=>{
      doc.setDrawColor(...INK); doc.setLineWidth(0.35);
      doc.rect(margin, y-3.1, 3.6, 3.6);
      if(checked){ doc.setFillColor(...GOLD); doc.rect(margin+0.5, y-2.6, 2.6, 2.6, 'F'); }
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
      const lines = doc.splitTextToSize(label, pageW-margin*2-9);
      doc.text(lines, margin+7, y);
      y += lines.length*4.6 + 4;
    });
    y += 3;

    doc.setFont('helvetica','italic'); doc.setFontSize(8.3); doc.setTextColor(...SLATE);
    const regLines = doc.splitTextToSize('La aceptación otorgada será registrada electrónicamente por la plataforma utilizada, conservando la evidencia necesaria para acreditar la identidad o autenticación del usuario, así como la fecha, hora y demás registros asociados a la manifestación de voluntad realizada.', pageW-margin*2);
    doc.text(regLines, margin, y); y += regLines.length*4 + 10;

    doc.setDrawColor(220,226,233); doc.setLineWidth(0.3);
    doc.roundedRect(margin, y, pageW-margin*2, 32, 1.5, 1.5, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...NAVY);
    doc.text('EVIDENCIA DE REGISTRO ELECTRÓNICO', margin+6, y+8);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...INK);
    const dtC = cd.timestamp ? new Date(cd.timestamp) : null;
    const estadoC = (cd.tratamiento&&cd.imagen&&cd.sensibles) ? 'Completo' : (cd.tratamiento||cd.imagen||cd.sensibles) ? 'Parcial' : 'No registrado';
    doc.text('Usuario: '+(state.portada.responsable||'—')+'   ·   Cargo: '+(state.portada.cargo||'—'), margin+6, y+15);
    doc.text('Fecha: '+(dtC?dtC.toLocaleDateString('es-EC'):'—')+'   ·   Hora: '+(dtC?dtC.toLocaleTimeString('es-EC'):'—'), margin+6, y+21);
    doc.text('Estado del consentimiento: '+estadoC, margin+6, y+27);
    y += 32+14;

    if(y > pageH-70){ addFooter(); doc.addPage(); y=30; }

    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...NAVY);
    doc.text('FIRMAS DE VALIDACIÓN', margin, y); y+=14;

    const colW = (pageW - margin*2 - 20)/2;
    const leftX = margin, rightX = margin + colW + 20;
    doc.setDrawColor(...INK); doc.setLineWidth(0.3);
    doc.line(leftX, y, leftX+colW, y);
    doc.line(rightX, y, rightX+colW, y);
    y += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
    doc.text(state.portada.responsable || '', leftX, y, {maxWidth:colW});
    doc.text(state.portada.revisor || '', rightX, y, {maxWidth:colW});
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...SLATE);
    doc.text(state.portada.cargo || 'Cargo', leftX, y);
    doc.text('Revisor', rightX, y);
    y += 6;
    doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(...SLATE);
    doc.text('Responsable de la autoevaluación', leftX, y);
    doc.text('Revisado por', rightX, y);

    addFooter();

    doc.save('Informe_Ejecutivo_'+(state.portada.institucion? state.portada.institucion.replace(/[^a-zA-Z0-9]+/g,'_') : 'Institucional')+'.pdf');
  } catch(err){
    console.error(err);
    alert('Ocurrió un error generando el PDF: '+err.message);
  } finally {
    if(btn){ btn.textContent=originalTxt; btn.disabled=false; }
  }
}
render();
</script>
</body>
</html>
